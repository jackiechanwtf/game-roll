<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Roll - во что играем?</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-window">
  <header class="topbar">
    <h1><a class="brand" href="/">Game Roll</a></h1>
    <a href="/docs">API / docs</a>
  </header>
  <main>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <section class="panel" aria-labelledby="your-game">
      <div class="section-heading"><h2 id="your-game">Твоя игра</h2><span id="who"></span></div>
      <form id="name-form" class="name-form">
        <div>
          <label for="player-name">Как тебя зовут?</label>
          <input id="player-name" list="player-names" placeholder="Имя или ник" maxlength="40" required autocomplete="nickname">
          <datalist id="player-names"></datalist>
        </div>
        <button type="submit">Выбрать имя</button>
      </form>
      <div id="game-area" hidden></div>
    </section>
    <section class="panel history" aria-labelledby="history-title">
      <div class="section-heading"><h2 id="history-title">Кто во что играет</h2><button id="refresh" class="subtle" type="button">Обновить</button></div>
      <div class="filters">
        <label>Игрок<select id="player-filter"><option value="">Все друзья</option></select></label>
        <label>Статус<select id="status-filter"><option value="">Все статусы</option><option value="playing">Прохожу</option><option value="completed">Пройдено</option><option value="dropped">Брошено</option></select></label>
        <span id="updated"></span>
      </div>
      <p id="empty-history" class="empty">Пока никто не выбрал игру.</p>
      <div class="table-wrap" id="history-wrap" hidden>
        <table>
          <thead><tr><th scope="col">Игрок</th><th scope="col">Игра</th><th scope="col">Сюжет</th><th scope="col">Потратил</th><th scope="col">Статус</th><th scope="col">Комментарий</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  </div>
</body>
</html>
